[servant]
port = 50051
host = "127.0.0.1"

[postgresql]
user = "jdbapi_admin"
password-file = "./resources/secrets/postgresql"
port = 54432
name = "jdbapi_database"
pool-size = 30
host = "localhost"
run-migrations = true

[redis]
port = 63779
password-file = "./resources/secrets/redis"

[cors]
origins = [ "http://127.0.0.1:5173" ]
methods = [ "OPTIONS", "POST", "PUT", "DELETE", "PATCH", "GET" ]
request-headers = [ "Authorization", "Content-Type", "Credentials" ]

[cookie]
same-site = "SameSiteLax"
secure = "NotSecure"
max-age = 7200
path = "/"
domain = "127.0.0.1"
session-cookie-name = "JWT-Cookie"

[mail]
send-timeout-seconds = 10
host = "email-smtp.eu-west-3.amazonaws.com"
user = "someUser"
password-file = "./resources/secrets/amazonses"
sender-name = "No-Reply - JDB Bot"
sender-mail = "my@org.org"

[web-frontend]
base-url = "http://127.0.0.1:5173"

[dev]
reported-version = "dev"
